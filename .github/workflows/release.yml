name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

      # Greasy Fork syncs the script from the release branch, so it only
      # ever sees released versions, never work in progress on master.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      - name: Move the release branch to this release
        if: ${{ steps.release.outputs.release_created }}
        run: git push origin HEAD:refs/heads/release
